notify:
  fields:
    message:
      required: true
      selector:
        text:
          multiline: true
    title:
      selector:
        text:
    subtitle:
      selector:
        text:
    person:
      selector:
        entity:
          domain: person
          multiple: true
    open:
      example: "shopping"
      selector:
        text:
    thread:
      selector:
        text:
    tag:
      selector:
        text:
    level:
      default: active
      selector:
        select:
          options: ["passive", "active", "time-sensitive"]
    sound:
      default: true
      selector:
        boolean:
    actions:
      selector:
        object:
    fallback:
      default: true
      selector:
        boolean:
register:
  fields:
    device_id:
      required: true
      selector:
        text:
    token:
      required: true
      selector:
        text:
    key:
      required: true
      selector:
        text:
    sandbox:
      selector:
        boolean:
    name:
      selector:
        text:
unregister:
  fields:
    device_id:
      required: true
      selector:
        text:
action:
  fields:
    action:
      required: true
      selector:
        text:
    tag:
      selector:
        text:
devices:
activity_register:
  fields:
    device_id:
      required: true
      selector:
        text:
    start_token:
      selector:
        text:
    kind:
      selector:
        text:
    token:
      selector:
        text:
live_activity:
  fields:
    person:
      selector:
        entity:
          domain: person
          multiple: true
    kind:
      required: true
      example: "timer"
      selector:
        text:
    action:
      default: start
      selector:
        select:
          options: ["start", "update", "end"]
    title:
      selector:
        text:
    detail:
      selector:
        text:
    ends:
      selector:
        datetime:
    icon:
      example: "timer"
      selector:
        text:
    tint:
      example: "#FF9F0A"
      selector:
        text:
    sound:
      default: false
      selector:
        boolean:
    dismiss:
      default: 0
      selector:
        number:
          min: 0
          max: 14400
          unit_of_measurement: s

badge:
  fields:
    count:
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 999
    person:
      selector:
        entity:
          domain: person
          multiple: true
